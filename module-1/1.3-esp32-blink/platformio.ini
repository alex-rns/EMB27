; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; One environment per task: tasks/<env-name>/ holds that task's main.cpp,
; Wokwi circuit (diagram.json + wokwi.toml), photos and README.

[platformio]
src_dir = tasks
; The task you are working on. Build/Upload use it unless you pick another
; environment in the status bar. Without it, Upload flashes EVERY task in turn.
default_envs = 05-extra-one-gpio

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; warnings for our own code only, not for the Arduino framework
build_src_flags = -Wall -Wextra

[env:00-lecture-blink]
build_src_filter = +<00-lecture-blink/>

[env:01-base-alternate]
build_src_filter = +<01-base-alternate/>

[env:02-extra-double-flash]
build_src_filter = +<02-extra-double-flash/>

[env:03-extra-third-led]
build_src_filter = +<03-extra-third-led/>

[env:04-extra-variable-speed]
build_src_filter = +<04-extra-variable-speed/>

[env:05-extra-one-gpio]
build_src_filter = +<05-extra-one-gpio/>
